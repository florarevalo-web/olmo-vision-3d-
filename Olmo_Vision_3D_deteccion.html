<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Olmo Vision 3D — Detección</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#101b29;color:white;font:14px system-ui}canvas{display:block;width:100%;height:100%}.ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#e4f46b;color:#182323;border:0;border-radius:12px;padding:12px;font-weight:750}#status{background:#142538dc;border-radius:10px;padding:9px;max-width:60%;font-size:12px}.bottom{position:fixed;bottom:12px;left:12px;right:12px;text-align:center;background:#132333cc;border-radius:10px;padding:8px;font-size:12px}video{display:none}</style></head>
<body><canvas id="scene"></canvas><video id="feed" autoplay playsinline muted></video><div class="ui"><button id="start">📷 Activar cámara y detección</button><span id="status">Demo 3D · Cámara apagada</span></div><div class="bottom">Experimental · Posiciones aproximadas · No usar como sistema anticolisión</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const c=document.querySelector('#scene'),ctx=c.getContext('2d'),video=document.querySelector('#feed'),status=document.querySelector('#status'),btn=document.querySelector('#start');
let detected=[],running=false,model=null;
function resize(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function draw(){const w=innerWidth,h=innerHeight,mid=w/2;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#253e60');sky.addColorStop(.6,'#78949e');sky.addColorStop(1,'#354b3c');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
const horizon=h*.32;ctx.fillStyle='#33424b';ctx.beginPath();ctx.moveTo(mid-35,horizon);ctx.lineTo(mid+35,horizon);ctx.lineTo(w+120,h);ctx.lineTo(-120,h);ctx.fill();
ctx.strokeStyle='#f6e8a0';ctx.lineWidth=3;for(let i=0;i<5;i++){let y=horizon+(h-horizon)*Math.pow((i+((Date.now()/900)%1))/5,1.7);let span=(y-horizon)*.09;ctx.beginPath();ctx.moveTo(mid,y);ctx.lineTo(mid,y+Math.max(5,span));ctx.stroke()}
const bikeY=h*.78;ctx.strokeStyle='#f4d646';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(mid-26,bikeY+30);ctx.lineTo(mid,bikeY-14);ctx.lineTo(mid+26,bikeY+30);ctx.lineTo(mid-26,bikeY+30);ctx.stroke();ctx.fillStyle='#aeb7bf';ctx.fillRect(mid-14,bikeY-25,28,26);ctx.fillStyle='#f4d646';ctx.fillRect(mid-8,bikeY-29,16,10);ctx.fillStyle='#0c151c';ctx.beginPath();ctx.ellipse(mid,bikeY+36,13,25,0,0,Math.PI*2);ctx.fill();
for(let i=0;i<detected.length;i++){let o=detected[i],x=mid+(o.cx-.5)*w*.8,y=horizon+(1-o.cy)*h*.38+o.cy*h*.28,sz=16+o.scale*70;x=Math.max(22,Math.min(w-22,x));y=Math.max(horizon+20,Math.min(h*.69,y));ctx.fillStyle=o.type==='person'?'#b8d6fa':'#e4a871';ctx.fillRect(x-sz/2,y-sz,sz,sz);ctx.fillStyle='#1c2b37';ctx.fillRect(x-sz*.36,y-sz*.65,sz*.72,sz*.23);ctx.fillStyle='white';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(o.label,x,y-sz-8)}
requestAnimationFrame(draw)}draw();
async function loop(){while(running){try{let p=await model.detect(video);detected=p.filter(x=>['car','truck','bus','person','motorcycle','bicycle'].includes(x.class)&&x.score>.48).slice(0,12).map(x=>({type:x.class,label:({'person':'Peatón','car':'Auto','truck':'Camión','bus':'Colectivo','motorcycle':'Moto','bicycle':'Bicicleta'})[x.class],cx:(x.bbox[0]+x.bbox[2]/2)/video.videoWidth,cy:(x.bbox[1]+x.bbox[3]/2)/video.videoHeight,scale:Math.min(1,x.bbox[2]/video.videoWidth)}));status.textContent='Detección activa · '+detected.length+' objeto(s)';}catch(e){status.textContent='Error de detección: '+e.message;running=false}await new Promise(r=>setTimeout(r,180))}}
btn.onclick=async()=>{btn.disabled=true;status.textContent='Solicitando cámara…';try{if(!window.isSecureContext)throw Error('Abrí la app desde una dirección HTTPS (no desde Descargas).');if(!navigator.mediaDevices?.getUserMedia)throw Error('Este navegador no permite usar la cámara aquí.');const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();status.textContent='Cargando inteligencia artificial… (requiere internet)';if(!window.cocoSsd)throw Error('No se pudo cargar el modelo; revisá internet.');model=await cocoSsd.load();running=true;btn.textContent='📷 Cámara activa';loop()}catch(e){status.textContent=e.name==='NotAllowedError'?'Permiso denegado: revisá el permiso de cámara de Chrome.':e.message;btn.disabled=false}};
</script></body></html>
