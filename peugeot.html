<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Peugeot Vision 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#090d14;color:#edf4ff;font:14px system-ui}header{position:absolute;z-index:2;top:12px;left:15px}h1{font-size:18px;margin:0}small{color:#8ca1b8}.badge{position:absolute;right:12px;top:14px;color:#9df5bf}#scene{width:100vw;height:100vh;display:block;touch-action:none}.bottom{position:absolute;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:end}.panel{background:#111b2bdc;border:1px solid #35475d;border-radius:14px;padding:12px}button{background:#23384e;color:white;border:1px solid #55718b;border-radius:8px;padding:10px}.legend{font-size:12px;color:#c2d0e1} #aiBox{position:absolute;top:64px;right:12px;width:min(42vw,320px);background:#101c2bef;border:1px solid #54728e;border-radius:12px;padding:8px;z-index:3}#cam{width:100%;display:block;border-radius:7px;background:#000}#overlay{position:absolute;left:8px;top:8px;width:calc(100% - 16px);pointer-events:none}#aiStatus{font-size:11px;color:#b7c9dc;margin:6px 0}#startAI{width:100%} </style></head><body><header><h1>PEUGEOT VISION 3D <span style="color:#53aaff">ULTRA</span></h1><small>2008 Feline · Vista cenital 3D</small></header><span class="badge">● DEMO</span><canvas id="scene"></canvas><div id="aiBox"><video id="cam" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="aiStatus">IA apagada · cámara sin conectar</div><button id="startAI">📷 Activar IA real</button></div><div class="bottom"><div class="panel"><b>Entorno simulado</b><div class="legend">🟢 Libre &nbsp; 🟡 Precaución &nbsp; 🔴 Cerca<br>Sin cámaras ni sensores conectados</div></div><button id="reset">Restablecer vista</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101822);scene.fog=new THREE.Fog(0x101822,38,100);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
scene.add(new THREE.HemisphereLight(0xddeeff,0x354051,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-8,18,9);scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.65});const road=mat(0x28313c),white=mat(0xe9eef5),glass=mat(0x142d45),wheel=mat(0x111317),blue=new THREE.MeshBasicMaterial({color:0x178cff});
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
box(110,.12,110,mat(0x1b2929),0,-.13,0);box(13,.04,110,road,0,0,0);
for(let z=-52;z<54;z+=9)box(.14,.015,4,white,0,.035,z);
const car=new THREE.Group();scene.add(car);box(2,.55,4.2,white,0,.65,0,car);box(1.76,.62,2.1,glass,0,1.18,-.25,car);box(1.78,.10,1.0,white,0,1.5,-.25,car);
for(const x of [-1.03,1.03])for(const z of [-1.32,1.32])box(.28,.62,.8,wheel,x,.47,z,car);
for(const x of [-.67,.67]){box(.35,.13,.07,mat(0xff2a35),x,.7,2.13,car);box(.35,.13,.07,mat(0xf3f7ff),x,.7,-2.13,car)}
const route=box(.11,.018,48,blue,0,.07,-26);route.material.transparent=true;route.material.opacity=.85;
function other(x,z,c){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(1.85,.65,3.7,mat(c),0,.6,0,g);box(1.55,.5,1.8,glass,0,1.12,-.2,g);return g}
other(-3.3,-9,0x327ad6);other(3.4,7,0xbec7d3);
function person(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.27,1.15,12),mat(0xffb341));body.position.y=.9;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,12),mat(0xe6b18a));head.position.y=1.68;g.add(head)}person(5,-3);
const marker=new THREE.Mesh(new THREE.RingGeometry(1.3,1.38,48),new THREE.MeshBasicMaterial({color:0xffd74a,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.set(3.4,.06,7);scene.add(marker);
let yaw=0,tilt=1.55,dist=16,drag=false,px=0,py=0;function view(){camera.position.set(Math.sin(yaw)*dist*Math.cos(tilt),dist*Math.sin(tilt),Math.cos(yaw)*dist*Math.cos(tilt));camera.lookAt(0,.3,0)}view();
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.008;tilt=Math.max(.45,Math.min(1.57,tilt+(e.clientY-py)*.006));px=e.clientX;py=e.clientY;view()});canvas.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(25,dist+e.deltaY*.015));view()},{passive:true});document.querySelector('#reset').onclick=()=>{yaw=0;tilt=1.55;dist=16;view()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script><script>
const start=document.querySelector('#startAI'),video=document.querySelector('#cam'),overlay=document.querySelector('#overlay'),status=document.querySelector('#aiStatus');
let model,stream,running=false,busy=false;
function script(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)})}
async function detect(){if(!running)return;if(!busy&&video.readyState>=2){busy=true;try{const predictions=await model.detect(video);overlay.width=video.videoWidth;overlay.height=video.videoHeight;const ctx=overlay.getContext('2d');ctx.clearRect(0,0,overlay.width,overlay.height);const allowed=['person','car','truck','bus','motorcycle','bicycle','dog','cat','horse','cow','sheep','bird'];let found=predictions.filter(p=>allowed.includes(p.class)&&p.score>=.5);for(const p of found){const [x,y,w,h]=p.bbox;ctx.strokeStyle='#41f5a0';ctx.lineWidth=Math.max(3,overlay.width/180);ctx.strokeRect(x,y,w,h);ctx.fillStyle='#41f5a0';ctx.font='bold '+Math.max(16,overlay.width/32)+'px sans-serif';ctx.fillText(p.class+' '+Math.round(p.score*100)+'%',x,Math.max(22,y-7))}status.textContent='IA ACTIVA · '+found.length+' objetos reconocidos · cámara en vivo'}catch(e){status.textContent='Error de detección: '+e.message}busy=false}if(running)setTimeout(detect,180)}
start.onclick=async()=>{if(running){running=false;stream?.getTracks().forEach(t=>t.stop());video.srcObject=null;overlay.getContext('2d').clearRect(0,0,overlay.width,overlay.height);start.textContent='📷 Activar IA real';status.textContent='IA apagada';return}start.disabled=true;try{status.textContent='Solicitando permiso de cámara…';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();status.textContent='Cargando modelo de IA…';if(!window.tf)await script('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');if(!window.cocoSsd)await script('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');model=await cocoSsd.load({base:'lite_mobilenet_v2'});running=true;start.textContent='⏹ Apagar IA';detect()}catch(e){stream?.getTracks().forEach(t=>t.stop());status.textContent='No se pudo iniciar: '+e.message}finally{start.disabled=false}};
</script></body></html>
