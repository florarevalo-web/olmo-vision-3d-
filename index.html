<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Olmo Vision 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1724;color:white;font:14px system-ui;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}button{border:0;border-radius:12px;background:#e8d342;color:#16202a;font-weight:700;padding:12px;font-size:13px}#status{background:#102537e8;border-radius:10px;padding:10px;font-size:12px;flex:1}#note{position:fixed;bottom:10px;left:12px;right:12px;text-align:center;font-size:11px;color:#d8e4ea;background:#102537c9;padding:7px;border-radius:8px}video{display:none}</style></head><body><canvas id="view"></canvas><video id="cam" playsinline muted autoplay></video><div id="ui"><button id="start">📷 Activar cámara</button><span id="status">Vista 3D · Cámara apagada</span></div><div id="note">Vista 3D sin video: animales, personas y vehículos detectados. Sin carriles inventados. No mide distancias ni velocidad. Probalo con la bici detenida.</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),video=document.getElementById('cam'),status=document.getElementById('status'),button=document.getElementById('start');let objects=[],model=null,enabled=false,loading=false;
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function line(x1,y1,x2,y2,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function wheel(x,y,r){ctx.fillStyle='#101820';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#c3d0d5';ctx.lineWidth=Math.max(1,r*.13);ctx.beginPath();ctx.arc(x,y,r*.74,0,7);ctx.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4;line(x,y,x+Math.cos(a)*r*.7,y+Math.sin(a)*r*.7,'#778d98',1)}}
function bike(x,y,s,own=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let yellow=own?'#f5d72b':'#4ad2d1';wheel(-32,0,23);wheel(36,0,23);line(-32,0,-8,-32,yellow,5);line(-8,-32,10,0,yellow,5);line(10,0,-32,0,yellow,5);line(10,0,25,-34,yellow,5);line(25,-34,-8,-32,yellow,5);line(25,-34,36,0,'#aebec8',5);line(18,-39,37,-39,'#222d36',5);line(-16,-37,1,-37,'#1b252d',5);line(10,0,20,9,'#cad6db',3);ctx.restore()}
function vehicle(x,y,s,type){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let truck=type==='truck'||type==='bus',W=truck?125:100,H=truck?65:43;ctx.fillStyle='#131b22';ctx.beginPath();ctx.ellipse(0,4,W*.58,11,0,0,7);ctx.fill();ctx.fillStyle=type==='bus'?'#e7c84e':truck?'#d5dfe4':'#327fb5';ctx.fillRect(-W/2,-H,W,H-8);poly([[-W*.37,-H],[-W*.23,-H-25],[W*.24,-H-25],[W*.4,-H]],'#d5e5ed');poly([[-W*.2,-H-22],[-W*.07,-H-22],[-W*.07,-H-4],[-W*.32,-H-4]],'#2a526a');poly([[0,-H-22],[W*.2,-H-22],[W*.33,-H-4],[0,-H-4]],'#2a526a');wheel(-W*.31,-6,13);wheel(W*.31,-6,13);ctx.fillStyle='#fff2b6';ctx.fillRect(W*.43,-H*.65,7,9);ctx.restore()}
function pedestrian(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#e8b48e';ctx.beginPath();ctx.arc(0,-75,12,0,7);ctx.fill();line(0,-60,0,-28,'#3588a7',16);line(-5,-52,-19,-31,'#e8b48e',7);line(5,-52,19,-35,'#e8b48e',7);line(-4,-26,-14,0,'#283b56',9);line(4,-26,14,0,'#283b56',9);ctx.restore()}
function rearBike(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,8,37,12,0,0,7);ctx.fill();ctx.fillStyle='#161c22';ctx.fillRect(-9,-35,18,48);ctx.fillStyle='#a6b3b9';ctx.fillRect(-5,-32,10,42);line(-7,-46,-24,-67,'#efd22d',7);line(7,-46,24,-67,'#efd22d',7);line(-24,-67,24,-67,'#efd22d',6);line(-36,-76,36,-76,'#28343b',7);ctx.fillStyle='#222a30';ctx.beginPath();ctx.ellipse(0,-87,23,9,0,0,7);ctx.fill();ctx.fillStyle='#e5cf32';ctx.fillRect(-5,-19,10,13);ctx.restore()}
function animal(x,y,s,cat){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,4,32,7,0,0,7);ctx.fill();ctx.fillStyle=cat?'#c9cbd0':'#b8946b';ctx.beginPath();ctx.ellipse(0,-23,30,19,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(25,-37,15,0,7);ctx.fill();poly([[15,-47],[18,-63],[27,-50]],cat?'#c9cbd0':'#b8946b');poly([[31,-49],[39,-60],[39,-40]],cat?'#c9cbd0':'#b8946b');for(let q of [-18,12]){ctx.fillRect(q,-13,7,17)}ctx.restore()}function draw(){const w=innerWidth,h=innerHeight,m=w/2;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#243b4c');sky.addColorStop(.44,'#78909b');sky.addColorStop(.45,'#4c5558');sky.addColorStop(1,'#242a2e');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);const horizon=h*.43;poly([[m-38,horizon],[m+38,horizon],[w+80,h],[-80,h]],'#303438');poly([[m-38,horizon],[m-34,horizon],[0,h],[0,h-5]],'#596067');poly([[m+34,horizon],[m+38,horizon],[w,h-5],[w,h]],'#596067');ctx.fillStyle='#11171b44';ctx.beginPath();ctx.ellipse(m,h*.96,w*.36,h*.05,0,0,Math.PI*2);ctx.fill();for(const o of objects){let x=w*(.12+.76*o.x),y=h*(.38+.40*o.y),s=Math.max(.35,Math.min(1.45,.35+o.scale*2.2));ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+5,35*s,8*s,0,0,7);ctx.fill();if(o.type==='cat'||o.type==='dog')animal(x,y,s,o.type==='cat');else if(o.type==='person')pedestrian(x,y,s);else if(o.type==='bicycle'||o.type==='motorcycle')bike(x,y,s*.85);else vehicle(x,y,s,o.type)}rearBike(m,h*.94,Math.min(1.65,w/240));requestAnimationFrame(draw)}draw();
async function detect(){while(enabled){try{let result=await model.detect(video);objects=result.filter(p=>p.score>.5&&['person','car','truck','bus','motorcycle','bicycle','dog','cat'].includes(p.class)).slice(0,10).map(p=>({type:p.class,x:(p.bbox[0]+p.bbox[2]/2)/video.videoWidth,y:1-(p.bbox[1]+p.bbox[3])/video.videoHeight,scale:Math.min(1,p.bbox[2]/video.videoWidth)}));status.textContent='Cámara activa · '+objects.length+' objeto(s) detectado(s)'}catch(e){enabled=false;status.textContent='Error de detección: '+e.message}await new Promise(r=>setTimeout(r,250))}}
button.onclick=async()=>{if(loading)return;loading=true;button.disabled=true;status.textContent='Solicitando permiso de cámara…';try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abrí esta página mediante HTTPS en Chrome');const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();status.textContent='Cargando IA (necesita internet)…';if(!window.cocoSsd)throw Error('No se cargó la IA. Revisá la conexión');model=await Promise.race([cocoSsd.load(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La IA tardó demasiado en cargar. Revisá internet o probá con Chrome actualizado.')),25000))]);enabled=true;button.textContent='📷 Cámara activa';status.textContent='IA lista · buscando objetos reales';detect()}catch(e){status.textContent=e.name==='NotAllowedError'?'Permiso denegado: habilitá cámara para este sitio en Chrome':e.message;button.disabled=false}finally{loading=false}};
</script></body></html>
