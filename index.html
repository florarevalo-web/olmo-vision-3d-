function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill()}

function bike(x,y,s,own=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let yellow=own?'#f5d72b':'#4ad2d1';wheel(-32,0,23);wheel(36,0,23);line(-32,0,-8,-32,yellow,5);line(-8,-32,10,0,yellow,5);line(10,0,-32,0,yellow,5);line(10,0,25,-34,yellow,5);line(25,-34,-8,-32,yellow,5);line(25,-34,36,0,'#aebec8',5);line(18,-39,37,-39,'#222d36',5);line(-16,-37,1,-37,'#1b252d',5);line(10,0,20,9,'#cad6db',3);ctx.restore()}
function vehicle(x,y,s,type){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let truck=type==='truck'||type==='bus',W=truck?125:100,H=truck?65:43;ctx.fillStyle='#131b22';ctx.beginPath();ctx.ellipse(0,4,W*.58,11,0,0,7);ctx.fill();ctx.fillStyle=type==='bus'?'#e7c84e':truck?'#d5dfe4':'#327fb5';ctx.fillRect(-W/2,-H,W,H-8);poly([[-W*.37,-H],[-W*.23,-H-25],[W*.24,-H-25],[W*.4,-H]],'#d5e5ed');poly([[-W*.2,-H-22],[-W*.07,-H-22],[-W*.07,-H-4],[-W*.32,-H-4]],'#2a526a');poly([[0,-H-22],[W*.2,-H-22],[W*.33,-H-4],[0,-H-4]],'#2a526a');wheel(-W*.31,-6,13);wheel(W*.31,-6,13);ctx.fillStyle='#fff2b6';ctx.fillRect(W*.43,-H*.65,7,9);ctx.restore()}

function estimateSurface(){if(!video.videoWidth||!video.videoHeight)return;try{sc.drawImage(video,0,0,80,60);let d=sc.getImageData(0,30,80,25).data,grey=0,green=0,brown=0,n=0;for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<24&&r>38&&r<215)grey++;if(g>r*1.17&&g>b*1.07)green++;if(r>g*1.14&&g>b*1.12)brown++;n++}let options=[['asfalto posible',grey/n],['vegetación posible',green/n],['tierra posible',brown/n]].sort((a,b)=>b[1]-a[1]);surface=options[0][1]>.66?options[0][0]:'desconocida';surfaceScore=options[0][1]}catch(e){surface='desconocida'}}

for(const o of objects){let x=w*(.12+.76*o.x),y=h*(.38+.40*o.y),s=Math.max(.35,Math.min(1.45,.35+o.scale*2.2));ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+5,35*s,8*s,0,0,Math.PI*2);ctx.fill();

<script>

const grey=mat(0x515e69),yellow=mat(0xe9c51e,.25),rubber=mat(0x1d252b),silver=mat(0xb7c3cc,.5),glass=mat(0x39596e,.25);
const ground=new T.Mesh(new T.PlaneGeometry(200,200),mat(0xaebbc1));ground.rotation.x=-Math.PI/2;ground.position.y=-.15;scene.add(ground);

function car3(type){let g=new T.Group(),truck=type==='truck'||type==='bus';let len=truck?3.7:2.6,width=truck?1.6:1.35;

// Segmentación semántica experimental ADE20K: identifica regiones de imagen,
// no profundidad, distancias ni tipos específicos de pavimento.
let segModel=null,segBusy=false,segReady=false,segLabel='no disponible',vegetation=[],plantHistory=[];

const plants3=[];
async function initSeg(){try{if(!window.deeplab)return;segModel=await deeplab.load({base:'ade20k',quantizationBytes:2});segReady=true}catch(e){console.warn('Segmentación no disponible',e)}}

const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
let chosen=keys.find(k=>/grass|field|earth|dirt|sand|road|sidewalk|floor|pavement|ground|rock|stone/.test(k));
if(chosen){segLabel=chosen;ground.material=/grass|field/.test(chosen)?grass:/earth|dirt|sand|rock|stone/.test(chosen)?earth:land}else{segLabel='no identificado';ground.material=land}

let tree=0,bush=0,total=0;
for(let j=0;j<5;j++)for(let i=0;i<5;i++){
const x=Math.min(W-1,Math.floor((ix+(i+.5)/5)*W/cols));

else if(bush/total>.55)locations.push({x:(ix+.5)/cols,y:.15+(iy+.5)*.57/rows,tree:false,key:ix+'-'+iy});
}
// Exigir coincidencia en dos análisis consecutivos antes de mostrar vegetación.
const next=locations.filter(v=>plantHistory.some(p=>p.key===v.key&&p.tree===v.tree));

}
let segLast=0;

// Franja azul meramente ilustrativa: NO es una zona transitable verificada.

const mini=document.getElementById('map'),toggle=document.getElementById('mapToggle'),frame=document.getElementById('mapframe'),route=document.getElementById('route');
let mapWanted=false,gpsOk=false;
toggle.addEventListener('click',()=>{mapWanted=!mapWanted;if(mapWanted&&!gpsOk){route.textContent='📍 Solicitando ubicación GPS…';navigator.geolocation?.getCurrentPosition(pos=>{gpsOk=true;const lat=pos.coords.latitude,lon=pos.coords.longitude;frame.src='https://www.openstreetmap.org/export/embed.html?bbox='+(lon-.003)+'%2C'+(lat-.003)+'%2C'+(lon+.003)+'%2C'+(lat+.003)+'&layer=mapnik&marker='+lat+'%2C'+lon;route.textContent='📍 GPS activo · sin destino definido';mini.classList.remove('hidden')},()=>{route.textContent='GPS no disponible · activá ubicación';mapWanted=false},{enableHighAccuracy:true,timeout:12000})}else mini.classList.toggle('hidden',!mapWanted)});
const shown=[];function sync(){for(const o of shown)scene.remove(o);shown.length=0;const placed=[];for(const d of objects.slice(0,18)){let o;if(['car','bus','truck'].includes(d.type))o=car3(d.type);else if(d.type==='person')o=person3();else if(['bicycle','motorcycle'].includes(d.type))o=bike3();else continue;const depth=-3-11*Math.max(0,Math.min(1,d.y));let x=(d.x-.5)*15;const scale=Math.max(.43,Math.min(1.15,.52+d.scale));for(let tries=0;tries<7;tries++){if(!placed.some(p=>Math.abs(p.x-x)<(p.s+scale)*.8&&Math.abs(p.z-depth)<1.6))break;x+=(tries%2?1:-1)*(tries+1)*.38}o.position.set(x,0,depth);o.scale.setScalar(scale);o.userData.kind=d.type;scene.add(o);shown.push(o);placed.push({x,z:depth,s:scale})}}
let last=0;function render(t){requestAnimationFrame(render);if(t-last>500){sync();refreshRings();const obstruction=objects.some(o=>o.x>.62&&o.y>.3&&['car','person','truck','bus','motorcycle','bicycle'].includes(o.type));mini.classList.toggle('hidden',!mapWanted||obstruction);last=t}if(t-segLast>3500){segLast=t;if(enabled)segment()}if(t-(window._plantsUpdated||0)>3500){window._plantsUpdated=t;for(const p of plants3)scene.remove(p);plants3.length=0;for(const v of vegetation){let p=v.tree?makeTree():makeBush();p.position.set((v.x-.5)*15,0,-2-v.y*18);p.scale.setScalar(v.tree?.85:.7);scene.add(p);plants3.push(p)}}renderer.render(scene,camera3)}
requestAnimationFrame(render);
addEventListener('resize',()=>{camera3.aspect=innerWidth/innerHeight;camera3.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('note').textContent='V15 · Vegetación filtrada y estabilizada (experimental). Franja azul ilustrativa; no indica ruta segura. Solo probar detenido.';
}catch(e){console.error('3D',e)}
})();
</script></body></html>
