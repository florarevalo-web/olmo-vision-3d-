<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Olmo Vision 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1724;color:white;font:14px system-ui;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}button{border:0;border-radius:12px;background:#e8d342;color:#16202a;font-weight:700;padding:12px;font-size:13px}#status{background:#102537e8;border-radius:10px;padding:10px;font-size:12px;flex:1}#note{position:fixed;bottom:10px;left:12px;right:12px;text-align:center;font-size:11px;color:#d8e4ea;background:#102537c9;padding:7px;border-radius:8px}video{display:none}</style></head><body><canvas id="view"></canvas><video id="cam" playsinline muted autoplay></video><div id="ui"><button id="start">📷 Activar cámara</button><span id="status">Vista 3D · Cámara apagada</span></div><div id="note">Vista experimental. Estimación de asfalto/tierra/vegetación por colores: puede fallar y NO sirve para navegar. Sin detector de carriles ni distancias. Usar solamente con la bici detenida.</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),video=document.getElementById('cam'),status=document.getElementById('status'),button=document.getElementById('start');let objects=[],model=null,enabled=false,loading=false,surface='desconocida',surfaceScore=0;const sample=document.createElement('canvas');sample.width=80;sample.height=60;const sc=sample.getContext('2d',{willReadFrequently:true});
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function line(x1,y1,x2,y2,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function wheel(x,y,r){ctx.fillStyle='#101820';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#c3d0d5';ctx.lineWidth=Math.max(1,r*.13);ctx.beginPath();ctx.arc(x,y,r*.74,0,7);ctx.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4;line(x,y,x+Math.cos(a)*r*.7,y+Math.sin(a)*r*.7,'#778d98',1)}}
function bike(x,y,s,own=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let yellow=own?'#f5d72b':'#4ad2d1';wheel(-32,0,23);wheel(36,0,23);line(-32,0,-8,-32,yellow,5);line(-8,-32,10,0,yellow,5);line(10,0,-32,0,yellow,5);line(10,0,25,-34,yellow,5);line(25,-34,-8,-32,yellow,5);line(25,-34,36,0,'#aebec8',5);line(18,-39,37,-39,'#222d36',5);line(-16,-37,1,-37,'#1b252d',5);line(10,0,20,9,'#cad6db',3);ctx.restore()}
function vehicle(x,y,s,type){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let truck=type==='truck'||type==='bus',W=truck?125:100,H=truck?65:43;ctx.fillStyle='#131b22';ctx.beginPath();ctx.ellipse(0,4,W*.58,11,0,0,7);ctx.fill();ctx.fillStyle=type==='bus'?'#e7c84e':truck?'#d5dfe4':'#327fb5';ctx.fillRect(-W/2,-H,W,H-8);poly([[-W*.37,-H],[-W*.23,-H-25],[W*.24,-H-25],[W*.4,-H]],'#d5e5ed');poly([[-W*.2,-H-22],[-W*.07,-H-22],[-W*.07,-H-4],[-W*.32,-H-4]],'#2a526a');poly([[0,-H-22],[W*.2,-H-22],[W*.33,-H-4],[0,-H-4]],'#2a526a');wheel(-W*.31,-6,13);wheel(W*.31,-6,13);ctx.fillStyle='#fff2b6';ctx.fillRect(W*.43,-H*.65,7,9);ctx.restore()}
function pedestrian(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#e8b48e';ctx.beginPath();ctx.arc(0,-75,12,0,7);ctx.fill();line(0,-60,0,-28,'#3588a7',16);line(-5,-52,-19,-31,'#e8b48e',7);line(5,-52,19,-35,'#e8b48e',7);line(-4,-26,-14,0,'#283b56',9);line(4,-26,14,0,'#283b56',9);ctx.restore()}
function rearBike(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
ctx.fillStyle='#17212a44';ctx.beginPath();ctx.ellipse(0,13,42,14,0,0,Math.PI*2);ctx.fill();
// Vista elevada oblicua: ambas ruedas se ven en perspectiva.
function rim(cx,cy,rx,ry){ctx.save();ctx.translate(cx,cy);ctx.scale(rx,ry);ctx.fillStyle='#192129';ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9eafb9';ctx.beginPath();ctx.arc(0,0,.72,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d6e1e5';ctx.beginPath();ctx.arc(0,0,.62,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#647d8c';ctx.lineWidth=.055;for(let i=0;i<12;i++){let a=i*Math.PI/6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(.60*Math.cos(a),.60*Math.sin(a));ctx.stroke()}ctx.fillStyle='#303b43';ctx.beginPath();ctx.arc(0,0,.12,0,Math.PI*2);ctx.fill();ctx.restore()}
rim(0,3,16,27);rim(0,-116,11,21);
// Cuadro de doble triangulo, gris y amarillo.
line(0,-9,-24,-55,'#202b34',9);line(-24,-55,0,-96,'#eacb27',8);line(0,-96,15,-47,'#eacb27',8);line(15,-47,-24,-55,'#f2d72d',8);line(15,-47,0,-9,'#aab7c1',8);line(-24,-55,0,-9,'#f2d72d',7);
line(-24,-55,-32,-70,'#667983',7);line(-46,-73,-18,-73,'#1b2832',8);
line(0,-96,0,-126,'#a7b5bc',7);line(-26,-127,26,-127,'#24313a',7);
line(15,-47,24,-40,'#aab9c2',4);line(24,-40,34,-42,'#242d36',5);line(15,-47,5,-40,'#aab9c2',4);line(5,-40,-6,-37,'#242d36',5);
ctx.fillStyle='#222b33';ctx.beginPath();ctx.ellipse(-32,-76,21,8,-.1,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f2d52a';ctx.beginPath();ctx.arc(15,-47,5,0,Math.PI*2);ctx.fill();
ctx.restore()}
function animal(x,y,s,cat){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,4,32,7,0,0,7);ctx.fill();ctx.fillStyle=cat?'#c9cbd0':'#b8946b';ctx.beginPath();ctx.ellipse(0,-23,30,19,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(25,-37,15,0,7);ctx.fill();poly([[15,-47],[18,-63],[27,-50]],cat?'#c9cbd0':'#b8946b');poly([[31,-49],[39,-60],[39,-40]],cat?'#c9cbd0':'#b8946b');for(let q of [-18,12]){ctx.fillRect(q,-13,7,17)}ctx.restore()}function plant(x,y,s,tree=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#6a4932';ctx.fillRect(-5,-38,10,38);ctx.fillStyle=tree?'#397f46':'#529b4b';for(const [dx,dy,r] of [[0,-55,25],[-18,-40,18],[18,-42,19]]){ctx.beginPath();ctx.arc(dx,dy,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function estimateSurface(){if(!video.videoWidth||!video.videoHeight)return;try{sc.drawImage(video,0,0,80,60);let d=sc.getImageData(0,30,80,25).data,grey=0,green=0,brown=0,n=0;for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<24&&r>38&&r<215)grey++;if(g>r*1.17&&g>b*1.07)green++;if(r>g*1.14&&g>b*1.12)brown++;n++}let options=[['asfalto posible',grey/n],['vegetación posible',green/n],['tierra posible',brown/n]].sort((a,b)=>b[1]-a[1]);surface=options[0][1]>.66?options[0][0]:'desconocida';surfaceScore=options[0][1]}catch(e){surface='desconocida'}}
function draw(){const w=innerWidth,h=innerHeight,m=w/2;
let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#dbe5ec');bg.addColorStop(.55,'#bfcdd5');bg.addColorStop(1,'#8d9ea8');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
const horizon=h*.33;
// La camara actual NO reconoce asfalto ni carriles: no inventar calles o lineas.
ctx.strokeStyle='#ffffff30';ctx.lineWidth=1;
for(let i=-8;i<=8;i++){let bottom=m+i*w*.20;line(m+i*7,horizon,bottom,h,'#ffffff25',1)}
for(let t=1;t<=7;t++){let q=t/8;let y=horizon+(h-horizon)*q*q;line(0,y,w,y,'#ffffff20',1)}
ctx.fillStyle='#233b4c';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(surface==='desconocida'?'SUPERFICIE NO IDENTIFICADA':surface.toUpperCase()+' · ESTIMACIÓN EXPERIMENTAL',m,h*.29);ctx.font='11px system-ui';ctx.fillText('SIN LÍNEAS: TODAVÍA NO HAY DETECTOR DE CARRILES',m,h*.31);
for(const o of objects){let x=w*(.12+.76*o.x),y=h*(.38+.40*o.y),s=Math.max(.35,Math.min(1.45,.35+o.scale*2.2));ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+5,35*s,8*s,0,0,Math.PI*2);ctx.fill();
if(o.type==='potted plant')plant(x,y,s,false);else if(o.type==='cat'||o.type==='dog')animal(x,y,s,o.type==='cat');else if(o.type==='person')pedestrian(x,y,s);else if(o.type==='bicycle'||o.type==='motorcycle')bike(x,y,s*.85);else if(['car','truck','bus'].includes(o.type))vehicle(x,y,s,o.type);else{ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#6588a5';ctx.beginPath();ctx.ellipse(0,-22,24,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('?',0,-18);ctx.restore()}}
rearBike(m,h*.80,Math.min(.82,w/520));requestAnimationFrame(draw)}draw();
async function detect(){while(enabled){try{estimateSurface();let result=await model.detect(video);objects=result.filter(p=>p.score>.5&&true).slice(0,10).map(p=>({type:p.class,x:(p.bbox[0]+p.bbox[2]/2)/video.videoWidth,y:1-(p.bbox[1]+p.bbox[3])/video.videoHeight,scale:Math.min(1,p.bbox[2]/video.videoWidth)}));status.textContent='IA activa · '+objects.length+' detectados · '+objects.map(o=>o.type).join(', ')}catch(e){enabled=false;status.textContent='Error de detección: '+e.message}await new Promise(r=>setTimeout(r,250))}}
button.addEventListener('click',async()=>{if(loading)return;loading=true;button.disabled=true;status.textContent='Solicitando permiso de cámara…';try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abrí esta página mediante HTTPS en Chrome');const stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La cámara no respondió en 12 segundos')),12000))]);video.srcObject=stream;await Promise.race([video.play(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('No se pudo iniciar el video')),10000))]);status.textContent='Cámara encendida · cargando IA…';if(!window.cocoSsd)throw Error('No se cargó la IA. Revisá la conexión');model=await Promise.race([cocoSsd.load(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La IA tardó demasiado en cargar. Revisá internet o probá con Chrome actualizado.')),25000))]);enabled=true;button.textContent='📷 Cámara activa';status.textContent='IA lista · buscando objetos reales';detect()}catch(e){status.textContent=e.name==='NotAllowedError'?'Permiso denegado: habilitá cámara para este sitio en Chrome':e.message;button.disabled=false;button.textContent='📷 Reintentar cámara'}finally{loading=false}});
</script></body></html>
