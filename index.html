<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Olmo Vision 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1724;color:white;font:14px system-ui;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}button{border:0;border-radius:12px;background:#e8d342;color:#16202a;font-weight:700;padding:12px;font-size:13px}#status{background:#102537e8;border-radius:10px;padding:10px;font-size:12px;flex:1}#note{position:fixed;bottom:10px;left:12px;right:12px;text-align:center;font-size:11px;color:#d8e4ea;background:#102537c9;padding:7px;border-radius:8px}video{display:none}</style></head><body><canvas id="view"></canvas><video id="cam" playsinline muted autoplay></video><div id="ui"><button id="start">📷 Activar cámara</button><span id="status">Vista 3D · Cámara apagada</span></div><div id="note">Prototipo experimental. Sin distancias reales ni función anticolisión. Probalo con la bicicleta detenida.</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),video=document.getElementById('cam'),status=document.getElementById('status'),button=document.getElementById('start');let objects=[],model=null,enabled=false,loading=false;
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function draw(){const w=innerWidth,h=innerHeight,m=w/2;let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#284861');bg.addColorStop(.5,'#547681');bg.addColorStop(1,'#193240');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const hy=h*.29;poly([[m-24,hy],[m+24,hy],[w+130,h],[-130,h]],'#42474b');ctx.strokeStyle='#f5e18c';ctx.lineWidth=4;ctx.setLineDash([15,20]);ctx.beginPath();ctx.moveTo(m,hy);ctx.lineTo(m,h);ctx.stroke();ctx.setLineDash([]);
for(const o of objects){let x=w*(.12+.76*o.x),y=h*(.37+.36*o.y),size=18+o.scale*100;const person=o.type==='person';poly([[x-size/2,y],[x+size/2,y],[x+size/2,y-size],[x-size/2,y-size]],person?'#f0a45b':'#65b5e8');poly([[x-size/2,y-size],[x-size/3,y-size*1.2],[x+size*.67,y-size*1.2],[x+size/2,y-size]],'#cbdbe6')}
const by=h*.81;ctx.fillStyle='#131d26';ctx.beginPath();ctx.ellipse(m,by+24,13,35,0,0,7);ctx.fill();ctx.strokeStyle='#e7ce2f';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(m-32,by+15);ctx.lineTo(m,by-35);ctx.lineTo(m+32,by+15);ctx.lineTo(m-32,by+15);ctx.stroke();ctx.strokeStyle='#a6b1b9';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(m-46,by-45);ctx.lineTo(m+46,by-45);ctx.stroke();ctx.fillStyle='#333d44';ctx.fillRect(m-15,by-7,30,20);requestAnimationFrame(draw)}draw();
async function detect(){while(enabled){try{let result=await model.detect(video);objects=result.filter(p=>p.score>.5&&['person','car','truck','bus','motorcycle','bicycle'].includes(p.class)).slice(0,10).map(p=>({type:p.class,x:(p.bbox[0]+p.bbox[2]/2)/video.videoWidth,y:1-(p.bbox[1]+p.bbox[3])/video.videoHeight,scale:Math.min(1,p.bbox[2]/video.videoWidth)}));status.textContent='Cámara activa · '+objects.length+' objeto(s) detectado(s)'}catch(e){enabled=false;status.textContent='Error de detección: '+e.message}await new Promise(r=>setTimeout(r,250))}}
button.onclick=async()=>{if(loading)return;loading=true;button.disabled=true;status.textContent='Solicitando permiso de cámara…';try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abrí esta página mediante HTTPS en Chrome');const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();status.textContent='Cargando IA (necesita internet)…';if(!window.cocoSsd)throw Error('No se cargó la IA. Revisá la conexión');model=await Promise.race([cocoSsd.load(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La IA tardó demasiado en cargar. Revisá internet o probá con Chrome actualizado.')),25000))]);enabled=true;button.textContent='📷 Cámara activa';status.textContent='IA lista · buscando objetos reales';detect()}catch(e){status.textContent=e.name==='NotAllowedError'?'Permiso denegado: habilitá cámara para este sitio en Chrome':e.message;button.disabled=false}finally{loading=false}};
</script></body></html>
