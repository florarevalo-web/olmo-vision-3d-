<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olmo Vision 3D</title><style>body{margin:0;background:#101923;color:white;font:15px Arial}#info{position:absolute;top:10px;left:10px;background:#142634dd;padding:12px;border-radius:10px}button{padding:12px;margin:5px;border:0;border-radius:8px}#buttons{position:absolute;bottom:12px;left:10px}</style></head><body><div id="info">OLMO VISION 3D<br>Simulación para Moto One<br><span id="state">Cargando...</span></div><div id="buttons"><button id="toggle">Pausar</button><button id="reset">Reiniciar</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color(0x172c38);const c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);c.position.set(0,15,18);c.lookAt(0,0,0);const r=new T.WebGLRenderer({antialias:false});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x334455,2));function cube(w,h,d,color,x,y,z){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color}));m.position.set(x,y,z);s.add(m);return m}cube(14,.1,60,0x40454b,0,0,0);for(let z=-28;z<30;z+=6)cube(.15,.02,3,0xe5c960,0,.07,z);cube(2,1,4,0xf2f2f2,0,.6,5);cube(1.5,.5,2,0x77b9d9,0,1.35,4.7);const other=cube(2,1.1,3.5,0x237ad4,-3,.6,-10);const walkers=[];for(let i=0;i<3;i++){const p=cube(.6,1.6,.6,0xffad55,i%2?4:-4,.85,-9+i*8);walkers.push(p)}let time=0,paused=false,last=performance.now();document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Continuar':'Pausar'};document.getElementById('reset').onclick=()=>time=0;function draw(now){requestAnimationFrame(draw);if(!paused)time+=Math.min((now-last)/1000,.05);last=now;other.position.z=-10+(time*2)%28;walkers.forEach((p,i)=>p.position.x=(i%2?4:-4)+Math.sin(time+i)*2);document.getElementById('state').textContent=paused?'Pausado':'Autos y peatones en movimiento';r.render(s,c)}requestAnimationFrame(draw);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});</script></body></html>
